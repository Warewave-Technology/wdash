# Targets for the lab's synthetic monitors.
#
# Six of them, because a monitoring page that only ever shows green proves
# nothing. Each one exists to produce a specific document:
#
#   8080  up            a plain 200
#   8081  down          a 500, so `monitor.status: down` and `error.*` appear
#   8082  echo          reflects headers, cookies and auth back as JSON
#   8083  journey       a sign-in form and a dashboard, for browser checks
#   8443  tls-healthy   a certificate valid for a year
#   8444  tls-expiring  a certificate valid for twelve days
#
# The expiring certificate is the point of a TLS monitor. Waiting a year to
# see the warning is not a test, so the lab ships a certificate that is
# already nearly gone.

events {}

http {
    access_log /dev/stdout;

    server {
        listen 8080;
        location / {
            add_header Content-Type text/plain;
            return 200 'ok';
        }
    }

    server {
        listen 8081;
        location / {
            add_header Content-Type text/plain;
            return 500 'deliberately broken';
        }
    }

    # Echoes what it was sent, so a check's headers, cookies and auth can be
    # verified rather than assumed. Also sets two response headers, which is
    # what the response-header assertions are for.
    server {
        listen 8082;
        add_header X-Request-Id "abc-123" always;
        location /echo {
            default_type application/json;
            return 200 '{"auth":"$http_authorization","cookie":"$http_cookie","api":"$http_x_api_version"}';
        }
        location /needs-auth {
            if ($http_authorization = "") { return 401 'no credentials'; }
            default_type application/json;
            return 200 '{"ok":true}';
        }
    }

    # The journey site. Two pages and a form, so a browser check has a real
    # sign-in to walk rather than a single document to assert against.
    server {
        listen 8083;
        root /usr/share/nginx/journey;
        index index.html;
        location / {
            try_files $uri $uri/ =404;
        }
    }

    server {
        listen 8443 ssl;
        server_name healthy.lab.local;
        ssl_certificate     /etc/nginx/certs/healthy.crt;
        ssl_certificate_key /etc/nginx/certs/healthy.key;
        location / {
            add_header Content-Type text/plain;
            return 200 'ok over tls';
        }
    }

    server {
        listen 8444 ssl;
        server_name expiring.lab.local;
        ssl_certificate     /etc/nginx/certs/expiring.crt;
        ssl_certificate_key /etc/nginx/certs/expiring.key;
        location / {
            add_header Content-Type text/plain;
            return 200 'ok, but not for much longer';
        }
    }
}
