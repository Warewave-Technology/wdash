<script nonce="{{ csp_nonce }}">
/* ------------------------------------------------------------------
 * Panel editor.
 *
 * Kept deliberately plain: a list of rows, each with its own controls,
 * serialised into a hidden field on submit. The server re-validates
 * everything — nothing here is trusted, and nothing here needs to be
 * clever enough to be worth a framework.
 *
 * One copy, included by BOTH forms. It was in the edit template only, so
 * the create form had no panel list at all and every dashboard started as
 * the same three panels; and a control added to one form would have been a
 * control missing from the other.
 * ---------------------------------------------------------------- */
const AGGREGATABLE = {{ aggregatable_fields | tojson }};
const HEIGHTS = {{ panel_heights | tojson }};
let panels = {{ panels | tojson }};

/* Whether `panels` above is the standard set rather than a list somebody
 * chose, and what the list looked like when this form was rendered. While
 * the two still agree the hidden field is sent EMPTY — see `serialise`. */
const DEFAULTED = {{ panels_are_default | tojson }};
const AS_RENDERED = JSON.stringify(panels);

// For a value inside a quoted attribute, which escapeHtml does not cover:
// it leaves quotes as they are. Replacing only `"` left `&` alone, so a title
// holding the text `&quot;` came back as a quote.
function escapeAttr(value) {
    return String(value).replace(/[&<>"']/g, c =>
        ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}

/* The option lists, each mirroring a tuple in wdash/dashboard/panels.py.
 * tests/test_panel_editor_types.py holds them to it: a value this form
 * offers that `normalise` refuses is not a warning, it is the author's whole
 * panel list thrown away — a refused save re-renders from the STORED list
 * whenever the submitted one does not validate. */
const TRACE_SORTS = ['spans', 'errors', 'error_rate'];
const TRACE_LIST_VIEWS = ['slowest', 'recent', 'errors'];
const MONITOR_VIEWS = ['status', 'availability'];

/* What each of those reads as — a table PER LIST, not one table keyed by the
 * bare value.
 *
 * `errors` is in two of the lists and means two different things: on a trace
 * list it is a VIEW, the traces that failed and no others; on a trace_services
 * panel it is an ORDERING over every service the window holds. panels.py says
 * so where TRACE_LIST_VIEWS is defined — "'errors' is not an ordering" — and a
 * single shared table made the Sort by select read "errors only", which is a
 * different question from the one that panel answers.
 *
 * A value missing from its table shows as itself rather than as nothing,
 * because the value IS the stored answer. */
const SORT_LABELS = Object.assign(Object.create(null), {
    spans: 'spans', errors: 'errors', error_rate: 'error rate',
});
const TRACE_VIEW_LABELS = Object.assign(Object.create(null), {
    slowest: 'the slowest', recent: 'the newest', errors: 'errors only',
});
const MONITOR_VIEW_LABELS = Object.assign(Object.create(null), {
    status: 'status right now', availability: 'availability over the window',
});

const optionsFor = (values, labels, selected) => values.map(v =>
    `<option value="${v}"${v === selected ? ' selected' : ''}>${
        labels[v] || v.replace('_', ' ')}</option>`).join('');

const fieldOptions = (selected, allowNone) =>
    (allowNone ? '<option value="">(total only)</option>' : '') +
    AGGREGATABLE.map(f =>
        `<option value="${f}"${f === selected ? ' selected' : ''}>${f}</option>`
    ).join('');

/** Said if the form is submitted without one, where there is room to say why. */
const SERVICE_NEEDED = 'A trace list needs a service to list traces for. '
    + 'Without one a Jaeger backend has to search every service it knows, on '
    + 'every refresh — so the save refuses the panel.';

/* And what the ROW says while the box is empty. Short on purpose: this sits
 * in a quarter-width column beside the box it is about, and the whole
 * sentence above stacked into it made the trace list's row 312 pixels tall
 * against 98 for every other row — which, the row being `align-items-end`,
 * pushed the Title control to the bottom of a ten-line warning. The reason is
 * worth saying where there is room for it: on the refusal. */
const SERVICE_MISSING = '<div class="form-text text-warning mt-0" '
    + 'data-needs-service>This panel needs a service.</div>';

/* ------------------------------------------------------------------
 * The controls each panel type gets, keyed by type.
 *
 * This was a ternary chain ending in the TIMESERIES controls, so every type
 * the chain did not name fell into it: `records` and `trace_list` — both
 * accepted by the server, neither in the add menu — were handed a "Split by"
 * select belonging to another question, and a person who chose a field there
 * saw it vanish on save because `normalise` does not keep `split_by` on a
 * records panel.
 *
 * A table with no prototype and an empty default, the way PANEL_HINTS in
 * async-dashboard.js is: a type nobody has written a row for here says
 * NOTHING rather than somebody else's controls. Every key in `PANEL_TYPES`
 * must appear, which tests/test_panel_editor_types.py measures — an empty
 * cell is honest but it is not a panel anybody can configure.
 *
 * Each row returns four grid columns, because the rest of the row (title 3,
 * width 2, height 2, buttons 1) takes the other eight.
 * ---------------------------------------------------------------- */
const PANEL_CONTROLS = Object.assign(Object.create(null), {
    timeseries: (panel) => `
      <div class="col-md-2">
        <label class="form-label small mb-0">Split by</label>
        <select class="form-select form-select-sm" data-key="split_by">
          ${fieldOptions(panel.split_by || '', true)}
        </select>
      </div>
      <div class="col-md-2"></div>`,

    terms: (panel) => `
      <div class="col-md-2">
        <label class="form-label small mb-0">Group by</label>
        <select class="form-select form-select-sm" data-key="field">
          ${fieldOptions(panel.field, false)}
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label small mb-0">Show top</label>
        <input type="number" class="form-control form-control-sm"
               data-key="size" min="1" max="50" value="${panel.size || 10}">
      </div>`,

    // Rows, and capped at MAX_RECORDS rather than at MAX_SIZE: a record is a
    // message and two maps where a bucket is two numbers, and the server
    // clamps to 25 anyway. A box that offers 50 and stores 25 is a lie the
    // author only finds by counting rows.
    records: (panel) => `
      <div class="col-md-2">
        <label class="form-label small mb-0">Rows</label>
        <input type="number" class="form-control form-control-sm"
               data-key="size" min="1" max="25" value="${panel.size || 10}">
      </div>
      <div class="col-md-2"></div>`,

    trace_services: (panel) => `
      <div class="col-md-2">
        <label class="form-label small mb-0">Sort by</label>
        <select class="form-select form-select-sm" data-key="sort">
          ${optionsFor(TRACE_SORTS, SORT_LABELS, panel.sort || 'spans')}
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label small mb-0">Show top</label>
        <input type="number" class="form-control form-control-sm"
               data-key="size" min="1" max="50" value="${panel.size || 10}">
      </div>`,

    // The service is REQUIRED and the row says so while it is empty, because
    // the save does not just refuse the panel: `_resubmitted` cannot
    // re-render a list that fails to validate, so it falls back to the
    // stored one and every other edit on the page goes with it.
    //
    // Three controls where every other type has at most two, so they take the
    // four columns as TWO lines rather than as two cells. Measured in Chromium
    // on the real create form: side by side, the Show select was 91px wide
    // with 56px of that its own padding and caret — 35px for a label needing
    // 92 — so all three of the panel's questions read "the", and which one the
    // panel was on could not be read off the page at all. Stacked, the select
    // gets the block's full width and the service box gets 294px rather than
    // 150 for names like `checkout-eu-west`.
    trace_list: (panel) => {
        const named = (panel.service || '').trim();
        return `
      <div class="col-md-4">
        <div class="row g-2">
          <div class="col-12">
            <label class="form-label small mb-0">Service</label>
            <input type="text" class="form-control form-control-sm"
                   data-key="service" placeholder="name one"
                   value="${escapeAttr(panel.service || '')}">
            <div data-service-warning>${named ? '' : SERVICE_MISSING}</div>
          </div>
          <div class="col-12">
            <label class="form-label small mb-0">Show</label>
            <div class="input-group input-group-sm">
              <select class="form-select form-select-sm" data-key="view">
                ${optionsFor(TRACE_LIST_VIEWS, TRACE_VIEW_LABELS,
                             panel.view || 'slowest')}
              </select>
              <input type="number" class="form-control form-control-sm"
                     style="max-width:4.5rem" data-key="size"
                     min="1" max="50" value="${panel.size || 5}">
            </div>
          </div>
        </div>
      </div>`;
    },

    // "Is it up now" and "was it up all window" are two questions out of one
    // fetch, so they are one panel type with a view rather than two types
    // costing two round trips.
    monitors: (panel) => `
      <div class="col-md-2">
        <label class="form-label small mb-0">Show</label>
        <select class="form-select form-select-sm" data-key="view">
          ${optionsFor(MONITOR_VIEWS, MONITOR_VIEW_LABELS, panel.view || 'status')}
        </select>
      </div>
      <div class="col-md-2"></div>`,

    monitor_certificates: () => '<div class="col-md-4"></div>',
});

/* What the row says the panel is, and what it costs to ask. Keyed the same
 * way and defaulting the same way: the lookup used to end in `|| panel.type`,
 * which printed the raw type name for anything it did not know, and — being
 * a plain object literal — would have printed a function body for a panel
 * type called `constructor`. */
const ROW_CAPTIONS = Object.assign(Object.create(null), {
    terms: 'Top values',
    timeseries: 'Volume over time',
    records: 'Recent records — the board’s own query and window, newest '
             + 'first; a search rather than an aggregation, so it costs '
             + 'one more request, shared by every records panel here',
    trace_services: 'Services by traffic — from traces, so this panel costs a second query',
    trace_list: 'Traces for one service — from traces, and a '
                + 'request of its own per service, view and row count; it '
                + 'needs traces:read and a service named',
    monitors: 'Monitor status — from the monitor sources, so this panel costs a second query, and it needs monitors:read to read',
    monitor_certificates: 'TLS certificates — rides the monitor panel’s source, and needs monitors:read to read',
});


function panelRow(panel, index) {
    const row = document.createElement('div');
    row.className = 'list-group-item';

    const controls = PANEL_CONTROLS[panel.type];
    const specific = controls ? controls(panel) : '<div class="col-md-4"></div>';

    row.innerHTML = `
      <div class="row g-2 align-items-end">
        <div class="col-md-3">
          <label class="form-label small mb-0">Title</label>
          <input type="text" class="form-control form-control-sm"
                 data-key="title" value="${escapeAttr(panel.title || '')}">
        </div>
        ${specific}
        <div class="col-md-2">
          <label class="form-label small mb-0">Width</label>
          <select class="form-select form-select-sm" data-key="width">
            ${[3, 4, 6, 8, 12].map(w =>
              `<option value="${w}"${w === panel.width ? ' selected' : ''}>${
                w === 12 ? 'full' : w + '/12'}</option>`).join('')}
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label small mb-0">Height</label>
          <select class="form-select form-select-sm" data-key="height">
            ${HEIGHTS.map(([px, label]) =>
              `<option value="${px}"${px === panel.height ? ' selected' : ''}>${
                escapeAttr(label)}</option>`).join('')}
          </select>
        </div>
        <div class="col-md-1 text-end">
          <div class="btn-group btn-group-sm">
            <button type="button" class="btn btn-outline-secondary" data-move="-1"
                    title="Move up"${index === 0 ? ' disabled' : ''}>&uarr;</button>
            <button type="button" class="btn btn-outline-secondary" data-move="1"
                    title="Move down"${index === panels.length - 1 ? ' disabled' : ''}>&darr;</button>
            <button type="button" class="btn btn-outline-danger" data-remove
                    title="Remove">&times;</button>
          </div>
        </div>
      </div>
      <small class="text-muted">${escapeAttr(ROW_CAPTIONS[panel.type] || '')}</small>`;

    row.querySelectorAll('[data-key]').forEach(input => {
        input.addEventListener('change', () => {
            const key = input.dataset.key;
            const numeric = key === 'size' || key === 'width' || key === 'height';
            const number = numeric ? parseInt(input.value, 10) : null;

            // An emptied number box is NOT a number. `parseInt('')` is NaN,
            // JSON.stringify writes NaN as `null`, and `normalise` reading
            // `int(None)` refuses the panel — which is not a refusal of the
            // panel: `_resubmitted` cannot re-render a list that fails to
            // validate, so it falls back to the stored one and every other
            // edit on the page goes with it. Clearing the Rows box and
            // pressing Save lost the author's whole panel list, and the only
            // thing on the page about it was "size must be a number".
            //
            // The box goes back to the value that will be saved rather than
            // the list going out with a hole in it — visible, and nothing is
            // stored that was not shown.
            if (numeric && Number.isNaN(number)) {
                input.value = panels[index][key];
                return;
            }
            panels[index][key] = numeric ? number : input.value;

            // The service is the one control whose value changes what the row
            // SAYS — the warning under it has to go when a service is typed,
            // and come back if it is cleared again. Only that sentence is
            // rewritten: redrawing the whole list from here destroyed the node
            // the keyboard was tabbing OUT of (`change` fires exactly as focus
            // leaves), so a person typing a service name and pressing Tab was
            // dropped to the document body instead of landing on the Show
            // select beside it.
            if (key === 'service') {
                row.querySelector('[data-service-warning]').innerHTML =
                    panels[index][key].trim() ? '' : SERVICE_MISSING;
            }
            serialise();
        });
    });
    row.querySelectorAll('[data-move]').forEach(button => {
        button.addEventListener('click', () => {
            const to = index + parseInt(button.dataset.move, 10);
            if (to < 0 || to >= panels.length) return;
            [panels[index], panels[to]] = [panels[to], panels[index]];
            drawPanels();
        });
    });
    row.querySelector('[data-remove]').addEventListener('click', () => {
        // A dashboard with no panels is a blank page, and the server refuses
        // it anyway — say so here rather than on submit.
        if (panels.length === 1) {
            alert('A dashboard needs at least one panel.');
            return;
        }
        panels.splice(index, 1);
        drawPanels();
    });
    return row;
}

/**
 * Put the list in the hidden field — or leave the field empty while the list
 * is still the untouched default set.
 *
 * Absent and "today's defaults" are different records. The server reads an
 * absent `panels` as "leave the default set", and `Dashboard.to_dict` writes
 * the key only once a board is customised, so that a board nobody has edited
 * keeps following the defaults rather than freezing the version of them that
 * was current the day it was saved. A form that always posted its rendered
 * list would have frozen them on every create and on every save of an
 * unedited board — the create form especially, where the list is the
 * defaults by definition.
 */
function serialise() {
    const text = JSON.stringify(panels);
    document.getElementById('panelsField').value =
        (DEFAULTED && text === AS_RENDERED) ? '' : text;
}

function drawPanels() {
    const list = document.getElementById('panelList');
    list.innerHTML = '';
    panels.forEach((panel, index) => list.appendChild(panelRow(panel, index)));
    serialise();
}

/* What a freshly added panel of each type is, before anybody touches it.
 *
 * Keyed and defaulted like the two tables above: a button naming a type that
 * is not here used to push `{...undefined}` — a panel with no type at all,
 * which the save refuses for the WHOLE board with "Unknown panel type:
 * (none)". A button nobody wrote a blank for now adds nothing. */
const BLANK_PANELS = Object.assign(Object.create(null), {
    terms: { type: 'terms', title: 'Top values', field: 'service',
             size: 10, width: 6, height: 300 },
    timeseries: { type: 'timeseries', title: 'Volume over time',
                  split_by: 'severity', width: 12, height: 300 },
    // Full width and taller than the standard card: the columns are a
    // timestamp, a severity, a service and a MESSAGE, and ten of them in a
    // half-width 300px box is a table read three words at a time.
    records: { type: 'records', title: 'Recent records', size: 10,
               width: 12, height: 450 },
    trace_services: { type: 'trace_services', title: 'Services by traffic',
                      sort: 'spans', size: 10, width: 6, height: 300 },
    // `service` is deliberately empty rather than guessed at: there is no
    // service name this form could invent that would be the right one, and
    // the row says what is missing until it is filled in.
    trace_list: { type: 'trace_list', title: 'Traces for one service',
                  service: '', view: 'slowest', size: 5, width: 6,
                  height: 300 },
    monitors: { type: 'monitors', title: 'Monitor status',
                view: 'status', width: 6, height: 300 },
    monitor_certificates: { type: 'monitor_certificates',
                            title: 'TLS certificates', width: 6,
                            height: 300 },
});

document.querySelectorAll('[data-add-panel]').forEach(button => {
    button.addEventListener('click', () => {
        const blank = BLANK_PANELS[button.dataset.addPanel];
        if (!blank) return;
        panels.push({ ...blank });
        drawPanels();
    });
});

document.querySelector('form').addEventListener('submit', (event) => {
    serialise();
    // The one control on this form whose value the server REFUSES to store.
    // Caught here because a refusal is not a refusal of the panel: the form
    // comes back rendered from the stored list, so the trace panel and every
    // other edit made beside it are gone with no sign they were ever typed.
    const nameless = panels.filter(
        p => p.type === 'trace_list' && !(p.service || '').trim());
    if (nameless.length) {
        event.preventDefault();
        alert(`${SERVICE_NEEDED}\n\nWaiting for a service: `
              + nameless.map(p => `“${p.title || 'Traces'}”`).join(', '));
    }
});

drawPanels();
</script>
