# Joining a stack trace back into one record, before it is indexed.
#
# The explanation is in the documentation, under "Stack traces arriving line
# by line". This file is the part you copy. Every grammar below was run
# through fluent-bit v4.0.1 against a real trace of its language, with an
# ordinary log line after it to catch a grammar that swallows what follows.
#
# Two stages, and they are not the same stage:
#
#   1. `multiline.parser cri` on the INPUT puts CRI's OWN split lines back
#      together — a line over 16KB, written in pieces with a `P` flag. It
#      has nothing to do with stack traces and you probably have it already.
#
#   2. The stack trace needs a FILTER with `mode parser`, because the
#      input's parser slot is spent on `cri`. The default mode is for (1)
#      and joins nothing here: measured, twelve lines in and twelve out,
#      with no error printed.
#
# ONE language per filter. `multiline.parser java, python` in one filter
# joined the traces correctly AND emitted Python's final exception line a
# second time as its own record — measured. Each grammar alone was right.

[SERVICE]
    flush         1
    parsers_file  /fluent-bit/etc/multiline-parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/containers/*.log
    Tag               kube.<namespace_name>.<container_name>.<pod_name>
    Tag_Regex         (?<pod_name>[a-z0-9](?:[-a-z0-9]*)?)_(?<namespace_name>[^_]+)_(?<container_name>.+)-
    Read_from_Head    false
    Skip_Long_Lines   On
    multiline.parser  cri

# --------------------------------------------------------------------------
# One filter per language, matched to the containers that speak it. Change
# the Match lines; that is the whole configuration step.
#
# `flush_timeout` is not decoration: the default is 5s, and a line held
# longer is emitted alone — which looks exactly like the fault you are
# fixing, and only under load.
# --------------------------------------------------------------------------

[FILTER]
    Name                   multiline
    Match                  kube.*.order-service.*
    multiline.key_content  log
    mode                   parser
    multiline.parser       java
    flush_timeout          2000

[FILTER]
    Name                   multiline
    Match                  kube.*.ingest-worker.*
    multiline.key_content  log
    mode                   parser
    multiline.parser       python
    flush_timeout          2000

[FILTER]
    Name                   multiline
    Match                  kube.*.edge-router.*
    multiline.key_content  log
    mode                   parser
    multiline.parser       go
    flush_timeout          2000

[FILTER]
    Name                   multiline
    Match                  kube.*.billing-api.*
    multiline.key_content  log
    mode                   parser
    multiline.parser       dotnet
    flush_timeout          2000

# Then the kubernetes filter as you already have it, AFTER these: the
# multiline filter works on the raw `log` key, and enriching first only
# gives it more to copy onto every joined line.
[FILTER]
    Name       kubernetes
    Match      kube.*
    Merge_Log  On
    Keep_Log   Off

# --------------------------------------------------------------------------
# What this does NOT fix, so that it is not a surprise:
#
#   * A container with no filter above, or the wrong one, is UNCHANGED.
#     Measured across six mismatched pairs: five joined nothing at all and
#     one joined part of a trace. None swallowed the following log line. So
#     a wrong grammar leaves you where you already were.
#
#   * Two threads writing a trace at the same moment interleave in the
#     stream, and nothing downstream can separate them without a thread id
#     on every line. That one the application solves, by logging the
#     exception as a FIELD rather than to stdout — which is what Serilog's
#     `@x` already does, and why a service logging through it never has
#     this problem.
