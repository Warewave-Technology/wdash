# Grammars for the languages fluent-bit has no built-in parser for.
# `java`, `python`, `go` and `ruby` are built in and need nothing here.
#
# A `start_state` rule matches the line that BEGINS an event; a `cont` rule
# appends a line to it; a line matching neither closes the record and stands
# on its own.
#
# Measured against fluent-bit v4.0.1. The counts are the trace's lines and
# the records that came out, the second of which is the ordinary log line
# that followed it.

# .NET, console form.  5 -> 2
[MULTILINE_PARSER]
    name          dotnet
    type          regex
    flush_timeout 1000
    rule          "start_state"  "/^(Unhandled exception|[\w.]+Exception: )/"  "cont"
    rule          "cont"         "/^\s*(at |--- End of|--- )/"                 "cont"

# .NET through the ASP.NET logger, which is a different grammar.  5 -> 2
[MULTILINE_PARSER]
    name          dotnet_aspnet
    type          regex
    flush_timeout 1000
    rule          "start_state"  "/^(info|warn|fail|crit|dbug|trce): /"  "cont"
    rule          "cont"         "/^      /"                            "cont"

# Node.js.  8 -> 2, including the `^` marker line and the blank line inside.
[MULTILINE_PARSER]
    name          node
    type          regex
    flush_timeout 1000
    rule          "start_state"  "/^(\/.*:\d+$|\w*Error: |\w+Error$)/"  "cont"
    rule          "cont"         "/^(\s|\^|$|\w*Error: |.*\^$)/"        "cont"

# PHP.  6 -> 2
[MULTILINE_PARSER]
    name          php
    type          regex
    flush_timeout 1000
    rule          "start_state"  "/^(PHP )?(Fatal error|Parse error|Warning|Notice|Deprecated)/"  "cont"
    rule          "cont"         "/^(Stack trace:|#\d+ |\s)/"                                     "cont"

# Rust.  9 -> 2. Three states, because the panic message is its own line at
# column 0 and only the FIRST such line belongs to the panic — a cont rule
# loose enough to take it would take the next log line too.
[MULTILINE_PARSER]
    name          rust
    type          regex
    flush_timeout 1000
    rule          "start_state"  "/^thread '.*' panicked at /"       "message"
    rule          "message"      "/^.*$/"                            "cont"
    rule          "cont"         "/^(\s|stack backtrace:|note: )/"   "cont"

# Elixir and Erlang.  4 -> 2
[MULTILINE_PARSER]
    name          elixir
    type          regex
    flush_timeout 1000
    rule          "start_state"  "/^\*\* \(/"  "cont"
    rule          "cont"         "/^\s+/"      "cont"

# Java, joined to YOUR logger's line rather than starting at the exception.
# The built-in `java` parser leaves them as two records; this makes one.
# 8 -> 1, plus the following line.
#
# `start_state` is Spring Boot's default timestamp. Logback's and log4j2's
# differ, and that line is the one thing here only you can write. The trade
# is real: a start pattern this broad means EVERY ordinary log line starts
# an event, so a grammar wrong about your format joins lines that have
# nothing to do with each other.
[MULTILINE_PARSER]
    name          java_spring
    type          regex
    flush_timeout 1000
    rule          "start_state"  "/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}/"                      "cont"
    rule          "cont"         "/^(\s|Caused by: |\t\.\.\. |[\w.$]+(Exception|Error)[: ])/"  "cont"
