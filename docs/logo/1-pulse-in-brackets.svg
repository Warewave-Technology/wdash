<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32"
     height="32" fill="none" id="wdash-mark-pulse" role="img"
     aria-label="WDash">
  <!--
    A terminal that watches.

    The brackets are the product's own idiom — a monospaced screen for people
    who live in one — and the line between them is the only thing on it that
    moves. It crosses both brackets on purpose: what is being watched does
    not stop at the edge of the window.

    Everything is `currentColor` except the pulse, so the mark inherits
    whatever ink the page uses and needs no second file for a light theme.
    The id-scoped style below only paints it when the file is opened on its
    own; inlined into a page, that page's `color` wins.
  -->
  <style>
    #wdash-mark-pulse { color: #1f2328; }
    @media (prefers-color-scheme: dark) {
      #wdash-mark-pulse { color: #f0f6fc; }
    }
  </style>
  <g stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M11.5 5.5H7v21h4.5"/>
    <path d="M20.5 5.5H25v21h-4.5"/>
  </g>
  <!--
    One heartbeat, not a scribble: flat, a spike, one deep trough, flat
    again. The first version drew four peaks of similar height and at 16
    pixels that is texture rather than a shape.
  -->
  <path d="M3.5 16h6.6l2.6-7.4 3.1 15 2.3-7.6h6.4"
        stroke="var(--wdash-accent, #fe8019)" stroke-width="2.7"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
