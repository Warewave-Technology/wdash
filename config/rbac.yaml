# WDash authorization configuration
#
# Each role declares three independent boundaries:
#
#   indices        log indices    (on the log side the unit is the index)
#   trace_indices  trace stores   (usually a single store, so mostly "*"):
#                  index names in Elasticsearch, the source's name in Tempo
#                  and Jaeger
#   services       visible services (on the trace side the unit is the service)
#
# Every list takes the same patterns: `*`, `prefix*`, `*suffix`, `*middle*`,
# `-pattern` to exclude (an exclusion beats every inclusion), and
# `source-name:pattern` to hold a rule to one source.
#
# Important: these controls live in the APPLICATION layer. Elasticsearch's
# Basic licence has no document-level security, so WDash must be the only door
# to the cluster. Expose Elasticsearch only to WDash at the network level.
#
# Fail closed: a boundary that is NOT declared grants nothing. Access has to be
# written out explicitly.
#
# Pattern semantics: a trailing wildcard is supported ("app-*"); a leading
# wildcard is not ("*-service" will not work).

roles:
  admin:
    permissions:
      - logs:read
      - traces:read
      - monitors:read
      - dashboard:create
      - dashboard:edit
      - dashboard:delete
      - dashboard:view
      - system:admin
    indices:
      - "*"
    trace_indices:
      - "*"
    services:
      - "*"

  developer:
    permissions:
      - logs:read
      - traces:read
      - monitors:read
      - dashboard:create
      - dashboard:edit
      - dashboard:view
    indices:
      - "app-*"
      - "service-*"
    trace_indices:
      - "*"
    # Application services are visible; infrastructure spans (postgres, redis,
    # elasticsearch, stripe-api) are not.
    services:
      - "api-gateway"
      - "auth-*"
      - "payment-*"
      - "user-*"
      - "search-*"
      - "notification-*"

  viewer:
    permissions:
      - logs:read
      - traces:read
      - dashboard:view
    indices:
      - "app-*"
    trace_indices:
      - "*"
    services:
      - "api-gateway"

user_roles:
  # Maps a named person to a role, ahead of any group they are in. For the
  # cases a group cannot express: one contractor, one stand-in during an
  # outage, one person whose directory entry is wrong today.
  #
  # Format: email or username -> role
  #
  # Deliberately empty. This file ships with the repository and is imported
  # into a fresh installation, so anything left here is a mapping every new
  # deployment inherits from somebody else — it used to carry a maintainer's
  # own username, which granted admin to anyone who happened to sign in with
  # that name.
  #
  #   alice@example.com: admin
  #   contractor@example.com: viewer
  {}

# Applied to authenticated users with no explicit mapping
default_role: viewer

# OIDC claim mapping
claim_mappings:
  email_claim: email
  username_claim: preferred_username
  groups_claim: groups

# Group to role mapping
#
# Namespaced on purpose. A directory almost certainly already has a group
# called `admins`, it usually means domain administrators, and mapping it
# here would hand `system:admin` to everybody in it.
group_roles:
  wdash-admins: admin
  wdash-developers: developer
  wdash-viewers: viewer
