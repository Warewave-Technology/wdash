<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32"
     height="32" fill="none" id="wdash-mark" role="img" aria-label="WDash">
  <!--
    The favicon, and the same drawing as the navbar's — kept in step by
    tests/test_frontend_integrity.py.

    A browser fetches this on its own, so nothing here can inherit anything:
    the ink is written out under `prefers-color-scheme`, which is what makes
    the mark legible against both a light and a dark tab strip. The style is
    scoped to this file's own id, because an unscoped `svg { color: … }`
    would reach every sparkline on any page this was ever inlined into.

    Gruvbox's fg1 for the brackets in each scheme. The pulse follows the
    scheme too, which the old one did not: it was the dark palette's cyan on
    every tab strip, 2.09:1 on a light one. Gruvbox's faded orange on light
    (6.12:1 on white), its bright orange on dark (6.38:1 on dark chrome).

    Browsers that ignore SVG favicons get wdash-mark-32.png, which is the
    same drawing in one colour — a mark that needs two to work is a mark that
    breaks here.
  -->
  <style>
    #wdash-mark { color: #3c3836; }
    #wdash-mark .pulse { stroke: #af3a03; }
    @media (prefers-color-scheme: dark) {
      #wdash-mark { color: #ebdbb2; }
      #wdash-mark .pulse { stroke: #fe8019; }
    }
  </style>
  <g stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M11.5 5.5H7v21h4.5"/>
    <path d="M20.5 5.5H25v21h-4.5"/>
  </g>
  <path class="pulse" d="M3.5 16h6.6l2.6-7.4 3.1 15 2.3-7.6h6.4"
        stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
