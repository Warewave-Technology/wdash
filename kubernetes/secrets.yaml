apiVersion: v1
kind: Secret
metadata:
  name: wdash-secrets
  labels:
    app.kubernetes.io/name: wdash
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # NOTHING HERE HAS A VALUE, AND THAT IS THE POINT.
  #
  # `secret-key` used to ship as a working base64 of
  # "your-super-secret-key-change-in-production". A comment said to change it,
  # and an unedited `kubectl apply` ran a production deployment on a session
  # key printed in a public repository — which is enough to forge anybody's
  # session cookie, including the administrator's. A placeholder that works is
  # not a placeholder.
  #
  # Empty is safe here because the application refuses to start on its
  # built-in development key when SESSION_COOKIE_SECURE is true. You get a
  # message naming this file, not a quiet fallback.
  #
  # Fill these in with a generator, never by hand, and keep them out of git —
  # `kubectl create secret generic wdash-secrets --from-literal=...`, or
  # whatever sealed/external secret machinery you already run.

  # Signs the session cookie.
  #   python -c "import secrets; print(secrets.token_urlsafe(48))" | tr -d '\n' | base64
  secret-key: ""

  # Encrypts the source credentials, the OIDC client secret and the LDAP bind
  # password held in the metadata database.
  #
  # WITHOUT IT the configuration page loads and then refuses to save any
  # credential, which reads as a permissions problem. It is a Fernet key, not
  # a passphrase:
  #   python -c "from cryptography.fernet import Fernet; \
  #              print(Fernet.generate_key().decode())" | tr -d '\n' | base64
  #
  # Changing it later makes every stored credential undecryptable. Back it up
  # with the database, not separately from it.
  encryption-key: ""

  # OIDC client secret, if the provider issued one.
  #   echo -n "your-oidc-client-secret" | base64
  oidc-client-secret: ""

  # Elasticsearch credentials, if the cluster has security enabled — and it
  # should: application-level authorization is worthless if the cluster is
  # reachable without one.
  #   echo -n "elastic" | base64
  elasticsearch-username: ""
  #   echo -n "password" | base64
  elasticsearch-password: ""
