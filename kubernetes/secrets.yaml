apiVersion: v1
kind: Secret
metadata:
  name: wdash-secrets
  labels:
    app.kubernetes.io/name: wdash
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # NOTHING HERE HAS A VALUE, AND THAT IS THE POINT.
  #
  # `secret-key` used to ship as a working base64 of
  # "your-super-secret-key-change-in-production". A comment said to change it,
  # and an unedited `kubectl apply` ran a production deployment on a session
  # key printed in a public repository — which is enough to forge anybody's
  # session cookie, including the administrator's. A placeholder that works is
  # not a placeholder.
  #
  # Empty is safe for `secret-key` because the application refuses to start
  # on its built-in development key when SESSION_COOKIE_SECURE is true. You
  # get a message naming this file, not a quiet fallback.
  #
  # It is NOT safe for `encryption-key`, and that is the one difference
  # between the two. An empty string is valid base64, the pod starts, and
  # what fails is sign-in — see the key itself below. Fill both.
  #
  # Fill these in with a generator, never by hand, and keep them out of git —
  # `kubectl create secret generic wdash-secrets --from-literal=...`, or
  # whatever sealed/external secret machinery you already run.

  # Signs the session cookie.
  #   python -c "import secrets; print(secrets.token_urlsafe(48))" | tr -d '\n' | base64
  secret-key: ""

  # Encrypts everything sealed in the metadata database: the source
  # credentials, the OIDC client secret, the LDAP bind password — and the
  # shared secret of the authenticator every local account now needs.
  #
  # WITHOUT IT THE POD STARTS AND NO LOCAL ACCOUNT CAN SIGN IN. An empty
  # value is valid base64, so nothing refuses the Secret; the first sign-in
  # goes to enrol an authenticator, the store declines to write its secret
  # as plain text, and there is no way through. The application says so at
  # start-up, as an ERROR rather than the warning beside it:
  #
  #   WDASH_ENCRYPTION_KEY is not set, so NO LOCAL ACCOUNT CAN SIGN IN: the
  #   authenticator every local account needs cannot be stored.
  #
  # The smaller half is the one this file used to describe on its own: the
  # configuration page loads and refuses to save a credential, which reads
  # as a permissions problem. Only a directory sign-in works until a key is
  # set. It is a Fernet key, not a passphrase:
  #   python -c "from cryptography.fernet import Fernet; \
  #              print(Fernet.generate_key().decode())" | tr -d '\n' | base64
  #
  # Changing it later makes every stored credential undecryptable, and takes
  # every enrolled authenticator with them — `python -m wdash.store.recover
  # --reset-totp <username>` is then the only way back in. Back it up with
  # the database, not separately from it.
  encryption-key: ""

  # No other credentials. A source's username and password, the OpenID
  # Connect client secret and the LDAP bind password are typed on the
  # configuration page and stored sealed with encryption-key above — which
  # is why that key has to be there before the first of them is.
