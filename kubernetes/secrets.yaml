apiVersion: v1
kind: Secret
metadata:
  name: wdash-secrets
  labels:
    app.kubernetes.io/name: wdash
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # Base64 encoded secret key (change this in production!)
  # echo -n "your-super-secret-key-change-in-production" | base64
  secret-key: eW91ci1zdXBlci1zZWNyZXQta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9u
  
  # Encrypts the source credentials stored from the configuration page.
  # WITHOUT IT the page loads and then refuses to save any credential, which
  # reads as a permissions problem. Generate one — it is not a passphrase:
  #   python -c "from cryptography.fernet import Fernet; \
  #              print(Fernet.generate_key().decode())" | base64
  # Changing it later makes every stored credential undecryptable.
  encryption-key: ""

  # OIDC Client Secret (if using OIDC)
  # echo -n "your-oidc-client-secret" | base64
  oidc-client-secret: ""
  
  # Elasticsearch credentials (if required)
  # echo -n "elastic" | base64
  elasticsearch-username: ""
  # echo -n "password" | base64
  elasticsearch-password: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # Redis password (optional)
  # echo -n "redis-password" | base64
  redis-password: ""