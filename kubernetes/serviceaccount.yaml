apiVersion: v1
kind: ServiceAccount
metadata:
  name: wdash
  labels:
    app.kubernetes.io/name: wdash
    app.kubernetes.io/component: serviceaccount
# No API token in the pod. WDash never calls the Kubernetes API — there is no
# client library in requirements.txt and no import of one anywhere in src/ —
# so the token is nothing but a credential sitting in the filesystem of an
# application that faces the internet.
automountServiceAccountToken: false

# WHAT USED TO BE HERE, and why it is gone.
#
# This file granted the account a ClusterRole over pods, services, endpoints,
# configmaps, deployments, replicasets and ingresses across the whole cluster,
# plus a namespace Role with get/list/watch/create/update/patch on `secrets`
# and read on `pods/log`. Nothing asked for any of it. WDash reads its
# configuration from environment variables and its state from a database.
#
# So the manifests turned a web-application compromise into namespace secret
# access, in exchange for no feature at all. The `KUBERNETES_NAMESPACE`,
# `KUBERNETES_POD_NAME` and `KUBERNETES_NODE_NAME` environment variables that
# went with it are gone from the Deployment for the same reason: nothing in
# the source reads them, and a variable that looks like configuration and
# changes nothing is worse than a missing one.
#
# The bindings also hard-coded `namespace: default` in their subjects, so
# installing anywhere else bound the permissions to an account that did not
# exist — the one thing about them that was harmless.
#
# If a future feature genuinely needs the API — reading pod logs directly,
# say — add back exactly the verbs it uses, in a Role rather than a
# ClusterRole, and turn the token mount back on in the same commit.
