apiVersion: apps/v1
kind: Deployment
metadata:
  name: wdash
  labels:
    app.kubernetes.io/name: wdash
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: wdash
spec:
  replicas: 1
  # Recreate, not RollingUpdate.
  #
  # The volume below is ReadWriteOnce and holds the SQLite database. A rolling
  # update starts the new pod BEFORE the old one releases the volume, so the
  # new pod cannot mount it: if the scheduler puts it on another node the
  # rollout stops dead with a Multi-Attach error, and if it puts it on the
  # same node two processes write one SQLite file. The symptom is an upgrade
  # that hangs in ContainerCreating with a healthy-looking old pod still
  # serving, which reads as a storage fault rather than as a manifest.
  #
  # The cost is honest and small: a few seconds of downtime per upgrade for a
  # single-replica deployment that already had exactly one pod. With Postgres
  # in DATABASE_URL and no PVC, RollingUpdate is right again — and so is
  # replicas > 1, provided the alert evaluator moves out of this pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wdash
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wdash
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: wdash
      # No prometheus.io/scrape. WDash exposes no /metrics endpoint, and the
      # annotation asking Prometheus to scrape one produced a target that is
      # permanently down — which reads as a broken application rather than as
      # a feature that was never built. Put it back with the endpoint, not
      # before.
    spec:
      serviceAccountName: wdash
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: wdash
        image: yigitbasalma/wdash-elastic-dashboard:3.1.7
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        # The whole ConfigMap, rather than nine keys named one at a time.
        # Naming them individually left six keys in that file describing a
        # deployment they never reached.
        envFrom:
        - configMapRef:
            name: wdash-config
        env:
        # Secrets stay explicit: the keys are named for what they are, not for
        # the variables that read them.
        #
        # Signs the session cookie. Empty in the shipped Secret on purpose —
        # the application refuses to start on its development key while
        # SESSION_COOKIE_SECURE is true, so an unedited apply fails with a
        # message instead of running on a key published in this repository.
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: wdash-secrets
              key: secret-key
        # Encrypts the credentials stored from the configuration page. Without
        # it the page loads but refuses to save any, which looks like a
        # permissions problem.
        - name: WDASH_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: wdash-secrets
              key: encryption-key
        # No other credentials: a source's, the OpenID Connect client secret
        # and the LDAP bind password are typed on the configuration page and
        # stored sealed with the encryption key above.
        # KUBERNETES_NAMESPACE, KUBERNETES_POD_NAME and KUBERNETES_NODE_NAME
        # used to be here from the downward API. Nothing in src/ reads any of
        # them, and they went out with the cluster RBAC that was their only
        # plausible reason to exist.

        volumeMounts:
        - name: dashboard-storage
          mountPath: /data
        - name: tmp
          mountPath: /tmp

        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        # Three probes, and the first one is why the other two can be
        # impatient. Migrations run at start-up against whatever DATABASE_URL
        # names; on a large Postgres that is not instant, and a liveness probe
        # with a fixed 30-second head start restarts the container in the
        # middle of one — repeatedly, which looks like a crash loop and is
        # actually a timeout.
        #
        # None of them reads /health any more. It asked every backend in
        # turn inside the request, and one that hung — an Elasticsearch GC
        # pause, a dropped route — made it answer in five seconds for a Loki
        # and twenty for the cluster, past every timeout here: the pod left
        # the Service and the kubelet restarted a container that was fine.
        # /livez asks nothing outside the process, which is all a restart can
        # fix; /readyz asks the metadata store, which is all that decides
        # whether anybody can be served. /health is for alerts and people.
        startupProbe:
          httpGet:
            path: /livez
            port: 5000
          periodSeconds: 5
          timeoutSeconds: 3
          # Five minutes to become ready, then liveness takes over.
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /livez
            port: 5000
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 5000
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

      # The alert evaluator.
      #
      # `python -m wdash.alerts` is a separate process on purpose: evaluation
      # has to run when nothing is arriving, because an agent going completely
      # silent produces no requests at all and that is exactly when somebody
      # needs telling. There was no workload for it anywhere in these
      # manifests, so a deployment made from them let people write alert rules
      # that were never evaluated — and nothing, anywhere, said so.
      #
      # In this pod rather than in a Deployment of its own because it needs
      # the same metadata database, and that database is a SQLite file on a
      # ReadWriteOnce volume. A second pod would have to be scheduled onto the
      # same node to mount it. Move it out when DATABASE_URL points at
      # Postgres — and only then.
      #
      # Run ONE. Two would evaluate the same rules and deliver the same alert
      # twice; the state table is shared, so the second usually finds the
      # transition already made, but "usually" is not a guarantee to page
      # somebody on. `replicas: 1` above is what holds it, and
      # tests/test_kubernetes_manifests.py holds `replicas: 1`.
      - name: alerts
        image: yigitbasalma/wdash-elastic-dashboard:3.1.7
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "wdash.alerts"]
        envFrom:
        - configMapRef:
            name: wdash-config
        env:
        # The same secrets: the evaluator opens the same store and reads the
        # same encrypted source credentials to query the backends.
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: wdash-secrets
              key: secret-key
        - name: WDASH_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: wdash-secrets
              key: encryption-key
        volumeMounts:
        - name: dashboard-storage
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        # No probe. It serves nothing, so there is no endpoint to ask; if the
        # loop dies the process exits and the kubelet restarts the container.
        # A probe that asked the evaluator about itself would answer that it
        # can reach itself.
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

      # Nginx sidecar for static file serving and reverse proxy
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        # Not 80. The container runs as uid 101 with every capability
        # dropped; NET_BIND_SERVICE was added back, but a capability added
        # in the security context reaches a non-root process only as an
        # ambient one, which no container runtime sets. Binding 80 then
        # depended on the node's net.ipv4.ip_unprivileged_port_start: 0 on
        # Docker and containerd 2, 1024 on containerd 1.x and CRI-O, where
        # the sidecar crash-looped on its first bind(). 8080 needs nothing.
        - containerPort: 8080
          name: nginx
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
          readOnly: true
        - name: nginx-tmp
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "50m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 101
          runAsGroup: 101
          capabilities:
            drop:
            - ALL

      volumes:
      - name: nginx-config
        configMap:
          name: wdash-nginx-config
      - name: dashboard-storage
        persistentVolumeClaim:
          claimName: wdash-data-pvc
      - name: tmp
        emptyDir: {}
      - name: nginx-tmp
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: wdash
  labels:
    app.kubernetes.io/name: wdash
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: wdash
spec:
  selector:
    app.kubernetes.io/name: wdash
    app.kubernetes.io/component: web
  ports:
  # 80 outside, the sidecar's 8080 inside: the Ingress and the agents keep
  # addressing port 80.
  - port: 80
    targetPort: 8080
    name: http
  # Port 5000 is NOT here.
  #
  # It used to be, and it published the application's own port beside the
  # proxied one — so anything in the cluster could skip the sidecar. That
  # matters because TRUSTED_PROXY_COUNT tells WDash to believe
  # `X-Forwarded-For`: a request arriving directly on 5000 can name any client
  # address it likes, and with it walk through the per-address sign-in
  # throttle and write someone else's address into the audit trail.
  #
  # Nothing needed it. The Ingress targets 80, and the kubelet's probes go to
  # the pod's own address rather than through a Service.
  type: ClusterIP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wdash-data-pvc
  labels:
    app.kubernetes.io/name: wdash
    app.kubernetes.io/component: storage
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
