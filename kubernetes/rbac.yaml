apiVersion: v1
kind: ServiceAccount
metadata:
  name: wdash
  labels:
    app.kubernetes.io/name: wdash
    app.kubernetes.io/component: serviceaccount

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wdash-reader
  labels:
    app.kubernetes.io/name: wdash
    app.kubernetes.io/component: rbac
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wdash-reader-binding
  labels:
    app.kubernetes.io/name: wdash
    app.kubernetes.io/component: rbac
subjects:
- kind: ServiceAccount
  name: wdash
  namespace: default
roleRef:
  kind: ClusterRole
  name: wdash-reader
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wdash-namespace-admin
  labels:
    app.kubernetes.io/name: wdash
    app.kubernetes.io/component: rbac
rules:
- apiGroups: [""]
  resources: ["secrets", "configmaps", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wdash-namespace-admin-binding
  labels:
    app.kubernetes.io/name: wdash
    app.kubernetes.io/component: rbac
subjects:
- kind: ServiceAccount
  name: wdash
  namespace: default
roleRef:
  kind: Role
  name: wdash-namespace-admin
  apiGroup: rbac.authorization.k8s.io