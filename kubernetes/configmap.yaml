apiVersion: v1
kind: ConfigMap
metadata:
  name: wdash-config
  labels:
    app.kubernetes.io/name: wdash
    app.kubernetes.io/component: config
data:
  # Every key here is read by the application, AND every key here reaches the
  # process: the Deployment loads this whole map with `envFrom`. It used to
  # name nine of them one at a time, so six keys sat in this file describing a
  # deployment they never reached.
  #
  # Keys that looked like configuration and changed nothing — LOG_LEVEL,
  # LOG_FORMAT, SESSION_TIMEOUT, MAX_SEARCH_SIZE, WORKERS, WORKER_CONNECTIONS,
  # WORKER_TIMEOUT, SECRET_KEY_FILE, REDIS_TIMEOUT, REDIS_URL,
  # ELASTICSEARCH_MAX_RETRIES — are gone. Somebody turns one and reports that
  # it had no effect.

  # Flask. No FLASK_ENV: Flask removed it in 2.3, and the only reader left in
  # this repository is run.sh, which the image does not use — its CMD is
  # gunicorn.
  FLASK_DEBUG: "false"

  # Metadata store: local accounts, roles, sources, saved searches, audit
  # trail and — with DASHBOARD_STORAGE below — the dashboards.
  #
  # Four slashes: an absolute path. Three would make it relative to WORKDIR
  # (/app), which is the container's own layer rather than the volume mounted
  # at /data, and every restart would start from an empty database.
  #
  # SQLite is right for one replica. For more than one, point this at
  # Postgres — postgresql+psycopg://user:pass@host/wdash — and then the
  # replica count, the Recreate strategy and the alert evaluator's place in
  # this pod are all free to change. A plain `postgresql://` is accepted and
  # normalised to the installed driver, so an address copied out of a
  # managed-database console works as it is. See kubernetes/README.md.
  DATABASE_URL: "sqlite:////data/wdash.db"
  # Keeps the dashboards and the saved searches with the rest of the
  # metadata. This is the DEFAULT and is spelt out only because setting it
  # to "file" sends them to DASHBOARD_STORAGE_FILE instead, so half the
  # state is on the volume as JSON and half is in the database.
  #
  # Those two values are the whole list. Anything else — one transposed
  # letter — stops the pod at start-up with a message naming both, rather
  # than falling through to the JSON store the way it used to: that showed
  # an empty dashboard list AND an empty saved-search list for data sitting
  # in the database, with nothing anywhere saying why.
  DASHBOARD_STORAGE: "database"
  # Still read with DASHBOARD_STORAGE=database, in two ways: it is where a
  # switch to "file" would put them, and it is the path the start-up check
  # looks at to tell an upgrade that its old JSON files have not been
  # migrated. On the volume, or an upgrade cannot see them at all.
  #
  # That check names both files in full — saved searches are taken from
  # beside this path — and prints the migration command. The command carries
  # no --database-url on purpose, because a Postgres address holds a
  # password and this goes to a log; it therefore has to be run somewhere
  # DATABASE_URL is already set, which is this pod:
  #
  #   kubectl -n wdash exec deploy/wdash -c wdash -- <the printed command>
  DASHBOARD_STORAGE_FILE: "/data/dashboards.json"

  # Elasticsearch, declared in the environment.
  #
  # This is the OLDER of the two ways to give WDash a backend and it still
  # works. The other one is the configuration page, which is where Loki,
  # VictoriaLogs, Tempo and any further Elasticsearch clusters are declared,
  # and which stores what it is given in the metadata database. A deployment
  # that has moved to the page leaves this empty.
  #
  # Set, it registers sources of its own — `elasticsearch-logs`,
  # `elasticsearch-traces` (unless TRACE_INDEX_PATTERNS below is empty) and
  # `elasticsearch-monitors`. Those names are not decoration: a role's rules
  # address a source by name, and the configuration page REFUSES a source
  # that would take one of them, because the environment's is registered
  # first and would keep it.
  #
  # If the same cluster is ALSO declared on the page, both register and a
  # merged search counts every matching record twice — silently, because the
  # totals simply look bigger. WDash says so twice when it sees it: once in
  # the start-up log, and once as a banner on the configuration page.
  #
  #   Source 'prod-logs' points at the same Elasticsearch as
  #   ELASTICSEARCH_URL (http://elasticsearch:9200). Both are registered, so
  #   a merged search counts every matching record twice. Unset
  #   ELASTICSEARCH_URL to keep only the configured source, or delete the
  #   configured one.
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  ELASTICSEARCH_TIMEOUT: "30"
  # Certificate verification, and it is off because the URL above is plain
  # HTTP inside the cluster, where there is no certificate to verify. Switch
  # BOTH together: an https:// URL with this left at "false" talks to whatever
  # answers, which is the failure the scheme was supposed to prevent.
  ELASTICSEARCH_VERIFY_CERTS: "false"
  # A CA bundle, for a cluster behind a private authority. Verification
  # without one trusts the system store only. Mount the bundle and name it
  # here — /etc/ssl/wdash/ca.crt, say, from a ConfigMap of your own.
  ELASTICSEARCH_CA_CERTS: ""
  # Which indices hold traces. Excluded from log search, or spans come back
  # as records with no body and no severity.
  TRACE_INDEX_PATTERNS: "*traces*,*apm*"
  # Where synthetic monitor results are. Empty means WDash's built-in list,
  # which covers Heartbeat and the Fleet Synthetics integration under their
  # own default names. A deployment that renamed them says so here.
  MONITOR_INDEX_PATTERNS: ""

  # OIDC, declared in the environment — the same older-of-two-ways as
  # ELASTICSEARCH_URL above. The configuration page declares OIDC and LDAP
  # too, and stores them.
  #
  # AT MOST ONE DIRECTORY SIGNS PEOPLE IN. Not one of each: one. Enabling a
  # second is refused on the page, and a directory saved there BEATS one
  # configured here — so filling these keys in on an installation that has
  # an LDAP card saved changes nothing, and nothing on this side says so.
  # The answer comes from the pod:
  #
  #   kubectl -n wdash exec deploy/wdash -c wdash -- \
  #       python -m wdash.store.recover --status
  #   Directory: LDAP (configured on the page); OpenID Connect is configured
  #   and NOT in use
  #
  # `--use-directory ldap|oidc|none` is how it is changed from here, and it
  # is the only way back when the directory in force is one nobody can sign
  # in to — the page that would fix it is behind that sign-in.
  #
  # The redirect URI has to be the host in ingress.yaml, over https, or the
  # provider sends the person back to somewhere that is not this application
  # — and the error it shows is about a mismatched redirect, not about a
  # ConfigMap. tests/test_kubernetes_manifests.py holds the two together.
  OIDC_DISCOVERY_URL: ""
  OIDC_CLIENT_ID: ""
  OIDC_REDIRECT_URI: "https://wdash.example.com/auth/callback"
  # `groups` is here because roles are mapped from groups, and a provider that
  # gates that claim behind a scope sends nothing without it — which arrives
  # as "this person belongs to nothing" and lands them on the default role.
  OIDC_SCOPES: "openid email profile groups"

  # Roles are not configured here, and no file in this directory holds
  # them. They live in the metadata store and are edited on the
  # configuration page. A new installation starts with admin, developer
  # and viewer, mapped from the groups wdash-admins, wdash-developers and
  # wdash-viewers, and nothing in these manifests — no restart, no
  # upgrade — changes a role that exists: an installation that imported
  # its roles from the rbac.yaml this directory used to carry keeps them.

  # Application
  LOGS_PER_PAGE: "50"
  MAX_SEARCH_RESULTS: "1000"

  # Security.
  #
  # TWO proxies, counted from the client inwards: the ingress controller, then
  # the nginx sidecar. This said "1", which is the sidecar alone — and reading
  # one entry in from the right of `X-Forwarded-For` then returns the INGRESS
  # CONTROLLER's address for every request. Every user shares one sign-in
  # throttle bucket and one attacker locks out everybody, which is the exact
  # failure the setting exists to prevent.
  #
  # Count everything that appends to that header, including a cloud load
  # balancer in front of the ingress if it is an L7 one.
  TRUSTED_PROXY_COUNT: "2"
  # TLS is terminated at the ingress, so without this the session cookie also
  # travels over plain HTTP to the same host. It is also why ingress.yaml MUST
  # declare `tls:` — a Secure cookie over http:// is never stored, and the
  # symptom is a sign-in that succeeds and returns to the sign-in page.
  SESSION_COOKIE_SECURE: "true"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wdash-nginx-config
  labels:
    app.kubernetes.io/name: wdash
    app.kubernetes.io/component: nginx
data:
  nginx.conf: |
    upstream wdash_backend {
        server 127.0.0.1:5000;
    }

    server {
        # The sidecar runs without privileges; see its container.
        listen 8080;
        server_name _;

        # Agents post their results here, screenshots included, in batches
        # that nginx's default of 1m refused: a handful of failed journeys
        # was a 413, and the agent dropped the batch — the down results
        # never arrived, the monitor stayed green, and nothing on the server
        # said so. The application refuses anything larger than this too
        # (MAX_CONTENT_LENGTH), and the agent keeps each batch well under it.
        client_max_body_size 16m;

        # Security headers come from the application, which sets them per
        # response alongside a Content-Security-Policy carrying a per-request
        # nonce. nginx `add_header` APPENDS rather than replaces, so setting
        # them here sent two X-Frame-Options — the app's DENY and this file's
        # SAMEORIGIN — and a browser reading conflicting values is entitled to
        # honour either. X-XSS-Protection is gone with them: it is removed
        # from every current browser and was itself an XSS vector.

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

        # Static files.
        #
        # A year and `immutable` is only safe because every asset the
        # templates request carries `?v=<version>`, so an upgrade asks for a
        # different URL. It did not: the version was a random number
        # regenerated on every page load, which re-downloaded the CSS and the
        # JavaScript on every single view — while the favicon and the logo,
        # which carried no version at all, stayed pinned for a year and would
        # have kept showing the OLD mark after an upgrade.
        location /static/ {
            alias /app/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Health check
        location /health {
            proxy_pass http://wdash_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Main application
        location / {
            proxy_pass http://wdash_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
