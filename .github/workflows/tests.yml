# What runs before anything is merged.
#
# The suite is a couple of thousand tests, and a good half of them are guards written after
# a specific mistake: a colour outside the palette, a template naming a
# theme, a dependency under a licence this project will not take, a test
# reaching the developer's own database. Every one of those is worth exactly
# as much as the thing that runs it, and until this file existed that was
# somebody remembering.
#
# Several jobs rather than one, because the suite means different things
# depending on what is installed beside it:
#
#   suite         no browser, no cluster — the tests that need one skip,
#                 and say so
#   browser       + Playwright and Chromium — the journeys and rendered pages
#   live-schema   + a seeded Elasticsearch — the two trace schemas
#   image         the Dockerfile, which no test touches
#   manifests     the Kubernetes objects, against the real API schemas
#
# The browser and live jobs set WDASH_REQUIRE_LAB / check the skip count,
# because a job that exists to run a test and goes green by skipping it is
# worse than no job at all.
#
# `manifests` is here because tests/test_kubernetes_manifests.py cannot do
# what it does: that file checks the manifests still describe THIS
# APPLICATION — every setting reaching the process, something evaluating the
# alert rules — and it would not notice a misspelled field or an apiVersion a
# cluster no longer serves. A whole file of Traefik CRDs on a group removed
# in v3 passed every test in this repository.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what the image ships. 3.14 is what the project is developed
        # on. Testing only one of them leaves the other to be discovered by
        # whoever hits it first.
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # The front-end suites are run BY the Python suite
      # (tests/test_frontend_integrity.py shells out to node), and they skip
      # themselves when node is missing — so without this the JavaScript goes
      # untested and nothing says so.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: pip install -r requirements.txt
      - run: npm ci

      - name: The suite
        # Not verbose: two thousand lines of test names bury the one that
        # failed. The specialised jobs below are where a SKIP is a failure;
        # here the ones that need a browser or a lab are expected, and the
        # count is printed at the end. No number is written down here: every
        # one that was had drifted from what the suite measured.
        run: python -m unittest discover -s tests -t .

      - name: The front-end suites, on their own as well
        run: npm test

  browser:
    name: browser journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Pinned to the version the browser image installs. A journey measured
      # against a different Chromium than the one that ships is a measurement
      # of something else.
      - name: Playwright and Chromium
        run: |
          pip install playwright==1.62.0
          playwright install --with-deps chromium

      - name: The journey suite, against a real browser
        run: python -m unittest tests.test_journeys -v

      # The other suite that needs a browser: it walks every screen in both
      # themes and measures what is on it. A colour nobody wrote is invisible
      # to a stylesheet reader, so this is the only job that can see one.
      - name: Every screen, rendered
        run: python -m unittest tests.test_rendered_pages -v

      - name: And nothing quietly skipped
        # `BrowserSuiteIsNotSilentlySkippedTest` holds this from the inside;
        # this holds it from the outside, where a failure to install
        # Playwright at all would otherwise look like a green run.
        run: |
          python - <<'PY'
          import io, unittest
          from unittest import TextTestRunner
          suite = unittest.defaultTestLoader.loadTestsFromNames(
              ["tests.test_journeys", "tests.test_rendered_pages"])
          result = TextTestRunner(stream=io.StringIO()).run(suite)
          print(f"{result.testsRun} run, {len(result.skipped)} skipped")
          for test, reason in result.skipped:
              print(f"  skipped: {test.id()} — {reason}")
          raise SystemExit(1 if result.skipped or not result.wasSuccessful()
                           else 0)
          PY

  live-schema:
    name: live schema equivalence
    runs-on: ubuntu-latest

    services:
      elasticsearch:
        # The same version the lab runs, because the document shapes this
        # job checks are read off a real cluster rather than a reference.
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.9
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      # Not ELASTICSEARCH_URL. The suite forces that one empty so no test can
      # reach a cluster nobody declared; these tests get their own name.
      WDASH_LAB_URL: http://localhost:9200
      WDASH_REQUIRE_LAB: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Enough of both schemas to compare, and no more: this job asks whether
      # a trace read as OTel and the same trace read as Elastic APM come out
      # identical, which needs variety rather than volume.
      - name: Seed both trace schemas
        run: python lab/seed/seed.py --logs 3000 --traces 400 --days 2

      - name: The parts that need a cluster
        run: python -m unittest tests.test_hub -v

  image:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The server target, which is the last stage and therefore what a plain
      # `docker build .` produces. Nothing in the suite can tell you the
      # Dockerfile stopped working — it is the one artefact every deployment
      # uses and the only one no test touches.
      #
      # Not the browser target: 1.77GB and several minutes, for a stage that
      # differs by one `pip install` and a `playwright install`. Worth a
      # nightly or a release, not a pull request.
      - name: Build the server image
        run: docker build -t wdash:ci .

      # Every process the image and the manifests start, started the way they
      # start it. This step used to put src on the path by hand before
      # importing, so it passed on an image where `python -m wdash.alerts` —
      # the evaluator in the Kubernetes pod — could not import `wdash` at all.
      # Nothing here edits the path.
      - name: Every entry point imports, the way it is started
        run: |
          docker run --rm wdash:ci python -m wdash.alerts --help
          docker run --rm wdash:ci python -m wdash.agent --help
          docker run --rm wdash:ci python -m wdash.store.recover --help
          docker run --rm wdash:ci python -c "import main; print('gunicorn target:', main.app)"

  manifests:
    name: kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned. An unpinned validator is a check whose meaning changes
      # without a commit.
      - name: kubeconform
        env:
          VERSION: v0.8.0
        run: |
          curl -sSfL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo install /tmp/kubeconform /usr/local/bin/

      - name: The kustomization builds
        run: kubectl kustomize kubernetes/ > /tmp/built.yaml

      # `-strict` is the point: without it an unknown field — a typo in
      # `startupProbe`, a field that moved between versions — validates
      # happily and is then silently ignored by the cluster.
      #
      # Three versions, because the manifests have to work on what people
      # actually run. 1.25 is where several of these apiVersions settled and
      # 1.34 is current; a kind that stops being served in between shows up
      # as one of the three failing rather than as a deployment that cannot
      # be applied.
      #
      # The two files the kustomization deliberately leaves out are named
      # here as well, or they would be the only manifests nothing validates.
      - name: Every object, against the API schemas
        run: |
          for version in 1.25.0 1.31.0 1.34.0; do
            echo "--- kubernetes $version"
            kubeconform -strict -summary -kubernetes-version "$version" \
                /tmp/built.yaml \
                kubernetes/secrets.yaml \
                kubernetes/wdash-agent.yaml
          done
